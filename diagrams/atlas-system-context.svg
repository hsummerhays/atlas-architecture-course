<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .core-box { fill: #1e1b4b; stroke: #818cf8; stroke-width: 3; rx: 12; }
      .actor-box { fill: #1e293b; stroke: #34d399; stroke-width: 2; rx: 8; }
      .ext-box { fill: #1e293b; stroke: #f472b6; stroke-width: 2; rx: 8; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
      .boundary { stroke: #475569; stroke-width: 2; stroke-dasharray: 6,6; fill: none; }
      .boundary-label { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">Atlas Enterprise Platform — System Context</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">System Boundary, Actors, and External Provider Integrations</text>

  <!-- Actors -->
  <g transform="translate(60, 140)">
    <rect width="180" height="90" class="actor-box" />
    <text x="90" y="40" class="text-title">Shippers & Tenants</text>
    <text x="90" y="62" class="text-sub">API Clients & Internal Apps</text>
    <text x="90" y="78" class="text-sub">(Canonical API Requests)</text>
  </g>

  <g transform="translate(60, 310)">
    <rect width="180" height="90" class="actor-box" />
    <text x="90" y="40" class="text-title">Operations & Support</text>
    <text x="90" y="62" class="text-sub">Platform Telemetry</text>
    <text x="90" y="78" class="text-sub">& Incident Diagnosis</text>
  </g>

  <!-- System Boundary -->
  <rect x="290" y="100" width="320" height="360" class="boundary" rx="16" />
  <text x="310" y="125" class="boundary-label">Atlas Platform Boundary</text>

  <!-- Core System -->
  <g transform="translate(320, 150)">
    <rect width="260" height="130" class="core-box" />
    <text x="130" y="40" class="text-title" style="font-size: 18px; fill: #c7d2fe;">Atlas Core</text>
    <text x="130" y="65" class="text-sub" style="fill: #a5b4fc;">Canonical Shipment Model</text>
    <text x="130" y="85" class="text-sub">Use Case Orchestration</text>
    <text x="130" y="105" class="text-sub">Durable State & Outbox</text>
  </g>

  <g transform="translate(320, 310)">
    <rect width="260" height="110" class="box" />
    <text x="130" y="40" class="text-title">Carrier Adapters</text>
    <text x="130" y="65" class="text-sub">Anti-Corruption Layers (ACL)</text>
    <text x="130" y="85" class="text-sub">Auth Strategies & Mapping</text>
  </g>

  <!-- External Systems -->
  <g transform="translate(660, 140)">
    <rect width="180" height="90" class="ext-box" />
    <text x="90" y="38" class="text-title">External Carriers</text>
    <text x="90" y="58" class="text-sub">FedEx, UPS, DHL, USPS</text>
    <text x="90" y="76" class="text-sub">(Proprietary APIs & Auth)</text>
  </g>

  <g transform="translate(660, 310)">
    <rect width="180" height="90" class="ext-box" />
    <text x="90" y="38" class="text-title">Downstream Consumers</text>
    <text x="90" y="58" class="text-sub">Tracking, Notifications,</text>
    <text x="90" y="76" class="text-sub">Accounting Intake</text>
  </g>

  <!-- Connectors -->
  <line x1="240" y1="185" x2="310" y2="185" class="arrow" />
  <line x1="240" y1="355" x2="310" y2="355" class="arrow" />
  <line x1="450" y1="280" x2="450" y2="300" class="arrow" />
  <line x1="580" y1="365" x2="650" y2="185" class="arrow" />
  <line x1="580" y1="215" x2="650" y2="355" class="arrow" />
</svg>
