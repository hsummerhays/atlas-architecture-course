<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .zone-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 8; }
      .data-zone { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 10; }
      .ctrl-zone { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 10; }
      .boundary-line { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 8,6; fill: none; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .text-boundary { fill: #f87171; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">Security Architecture &amp; Trust Boundaries</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">Plane separation, managed workload identities, least privilege, and non-self-approving agent guardrails</text>

  <!-- Untrusted Internet Boundary -->
  <line x1="280" y1="100" x2="280" y2="470" class="boundary-line" />
  <text x="290" y="120" class="text-boundary">Trust Boundary: Public / Internal</text>

  <!-- Public Internet Zone -->
  <g transform="translate(40, 140)">
    <rect width="200" height="120" class="zone-box" />
    <text x="100" y="35" class="text-title">Public Clients</text>
    <text x="100" y="58" class="text-sub">Shippers &amp; Webhooks</text>
    <text x="100" y="78" class="text-sub">Untrusted Network Zone</text>
    <text x="100" y="98" class="text-sub">Bearer Tokens &amp; TLS</text>
  </g>

  <!-- Data Plane Zone -->
  <g transform="translate(340, 130)">
    <rect width="260" height="320" class="data-zone" />
    <text x="130" y="35" class="text-title" style="fill: #c7d2fe; font-size: 16px;">Data Plane Runtime</text>
    <text x="130" y="55" class="text-sub" style="fill: #a5b4fc;">atlas-shipping-app</text>
    
    <rect x="20" y="75" width="220" height="65" class="zone-box" />
    <text x="130" y="100" class="text-title">Managed Identity</text>
    <text x="130" y="122" class="text-sub">Short-lived STS Tokens</text>

    <rect x="20" y="155" width="220" height="65" class="zone-box" />
    <text x="130" y="180" class="text-title">Resource-Scoped Auth</text>
    <text x="130" y="202" class="text-sub">Tenant Boundary Enforced</text>

    <rect x="20" y="235" width="220" height="65" class="zone-box" />
    <text x="130" y="260" class="text-title">Isolated Secrets</text>
    <text x="130" y="282" class="text-sub">Carrier Credentials Only</text>
  </g>

  <!-- Separation Line Between Data Plane and Control Plane -->
  <line x1="640" y1="100" x2="640" y2="470" class="boundary-line" />
  <text x="650" y="120" class="text-boundary">Trust Boundary: Runtime / Automation</text>

  <!-- Control Plane & Agent Governance Zone -->
  <g transform="translate(680, 130)">
    <rect width="240" height="320" class="ctrl-zone" />
    <text x="120" y="35" class="text-title" style="fill: #bfdbfe; font-size: 16px;">Control Plane / CI/CD</text>
    <text x="120" y="55" class="text-sub" style="fill: #93c5fd;">atlas-agent-platform &amp; GitHub</text>
    
    <rect x="20" y="75" width="200" height="65" class="zone-box" />
    <text x="120" y="100" class="text-title">Agent Automation</text>
    <text x="120" y="122" class="text-sub">Propose PRs &amp; Fixes Only</text>

    <rect x="20" y="155" width="200" height="65" class="zone-box" />
    <text x="120" y="178" class="text-title" style="fill: #fca5a5;">Separation of Duty</text>
    <text x="120" y="198" class="text-sub">Agents CANNOT self-approve,</text>
    <text x="120" y="214" class="text-sub">merge, or deploy to prod</text>

    <rect x="20" y="235" width="200" height="65" class="zone-box" />
    <text x="120" y="260" class="text-title">Distinct Secrets</text>
    <text x="120" y="282" class="text-sub">No Shipping Prod DB Access</text>
  </g>
</svg>
