<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .stage-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .stage-core { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 8; }
      .stage-adapter { fill: #312e81; stroke: #a78bfa; stroke-width: 2; rx: 8; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .text-num { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">Synchronous Shipment Booking Request Path</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">End-to-end request lifecycle from authenticated client boundary to carrier execution and truthful persistence</text>

  <!-- Step 1: Transport & Auth -->
  <g transform="translate(40, 130)">
    <rect width="150" height="120" class="stage-box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">1</text>
    <text x="75" y="45" class="text-title">API Edge</text>
    <text x="75" y="68" class="text-sub">Transport Deserialization</text>
    <text x="75" y="86" class="text-sub">JWT Token Validation</text>
    <text x="75" y="104" class="text-sub">Tenant Context Setup</text>
  </g>

  <!-- Step 2: Resource Auth & Validation -->
  <g transform="translate(225, 130)">
    <rect width="150" height="120" class="stage-box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">2</text>
    <text x="75" y="45" class="text-title">Boundary Guard</text>
    <text x="75" y="68" class="text-sub">Resource Authorization</text>
    <text x="75" y="86" class="text-sub">Tenant Boundary Check</text>
    <text x="75" y="104" class="text-sub">Contract Validation</text>
  </g>

  <!-- Step 3: Application Coordination -->
  <g transform="translate(410, 130)">
    <rect width="150" height="120" class="stage-core" />
    <circle cx="20" cy="20" r="12" fill="#4338ca" />
    <text x="20" y="24" class="text-num">3</text>
    <text x="75" y="45" class="text-title">Application Core</text>
    <text x="75" y="68" class="text-sub">Use Case Orchestrator</text>
    <text x="75" y="86" class="text-sub">Domain Invariant Check</text>
    <text x="75" y="104" class="text-sub">Carrier Selection</text>
  </g>

  <!-- Step 4: Carrier Adapter (Port) -->
  <g transform="translate(595, 130)">
    <rect width="150" height="120" class="stage-adapter" />
    <circle cx="20" cy="20" r="12" fill="#6d28d9" />
    <text x="20" y="24" class="text-num">4</text>
    <text x="75" y="45" class="text-title">Carrier Adapter</text>
    <text x="75" y="68" class="text-sub">Translation to Carrier DTO</text>
    <text x="75" y="86" class="text-sub">Credential Acquisition</text>
    <text x="75" y="104" class="text-sub">External Call & Timeout</text>
  </g>

  <!-- Step 5: Truthful Persistence -->
  <g transform="translate(780, 130)">
    <rect width="140" height="120" class="stage-core" />
    <circle cx="20" cy="20" r="12" fill="#4338ca" />
    <text x="20" y="24" class="text-num">5</text>
    <text x="70" y="45" class="text-title">Persistence</text>
    <text x="70" y="68" class="text-sub">Shipment State</text>
    <text x="70" y="86" class="text-sub">+ Outbox Event Intent</text>
    <text x="70" y="104" class="text-sub">(Atomic Commit)</text>
  </g>

  <!-- Flow Arrows -->
  <line x1="190" y1="190" x2="220" y2="190" class="arrow" />
  <line x1="375" y1="190" x2="405" y2="190" class="arrow" />
  <line x1="560" y1="190" x2="590" y2="190" class="arrow" />
  <line x1="745" y1="190" x2="775" y2="190" class="arrow" />

  <!-- Return response path -->
  <path d="M 850,250 L 850,330 L 115,330 L 115,260" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowhead-green)" />
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
  </defs>
  <text x="480" y="360" class="text-sub" style="fill: #34d399; font-size: 13px; font-weight: bold;">Synchronous Canonical Response (Shipment ID, Carrier Ref, Truthful Status)</text>
</svg>
