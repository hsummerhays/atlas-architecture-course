<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .warn-box { fill: #451a03; stroke: #fbbf24; stroke-width: 2; rx: 8; }
      .trip-box { fill: #450a0a; stroke: #f87171; stroke-width: 2; rx: 8; }
      .ok-box { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 8; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">Distributed Resilience &amp; Fault Containment Flow</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">Timeout, Exponential Backoff with Jitter, Circuit Breaker State Machine, and DLQ Isolation</text>

  <!-- Step 1: Outbound Call & Timeout -->
  <g transform="translate(40, 140)">
    <rect width="180" height="110" class="box" />
    <text x="90" y="35" class="text-title">1. Outbound Call</text>
    <text x="90" y="58" class="text-sub">Carrier HTTP Request</text>
    <text x="90" y="78" class="text-sub">Strict Bounded Timeout</text>
    <text x="90" y="96" class="text-sub">(e.g. 2500ms limit)</text>
  </g>

  <!-- Step 2: Retry with Backoff & Jitter -->
  <g transform="translate(260, 140)">
    <rect width="200" height="110" class="warn-box" />
    <text x="100" y="35" class="text-title" style="fill: #fef08a;">2. Transient Failure</text>
    <text x="100" y="58" class="text-sub">Exponential Backoff</text>
    <text x="100" y="78" class="text-sub">+ Full Random Jitter</text>
    <text x="100" y="96" class="text-sub">Bounded Retry Budget (Max 3)</text>
  </g>

  <!-- Step 3: Circuit Breaker -->
  <g transform="translate(500, 110)">
    <rect width="200" height="170" class="trip-box" />
    <text x="100" y="30" class="text-title" style="fill: #fca5a5;">3. Circuit Breaker</text>
    <text x="100" y="52" class="text-sub">Failure Rate &gt; Threshold (50%)</text>
    <line x1="20" y1="65" x2="180" y2="65" stroke="#7f1d1d" stroke-width="1" />
    <text x="100" y="85" class="text-sub" style="font-weight: bold; fill: #f87171;">STATE: OPEN</text>
    <text x="100" y="105" class="text-sub">Fail-Fast Immediate Reject</text>
    <text x="100" y="125" class="text-sub">Zero Load to Carrier</text>
    <text x="100" y="150" class="text-sub" style="fill: #fbbf24;">State: Half-Open (Probe)</text>
  </g>

  <!-- Step 4: Graceful Degradation / DLQ -->
  <g transform="translate(740, 140)">
    <rect width="180" height="110" class="ok-box" />
    <text x="90" y="35" class="text-title" style="fill: #a7f3d0;">4. Fault Containment</text>
    <text x="90" y="58" class="text-sub">Synchronous: Fast Error</text>
    <text x="90" y="78" class="text-sub">Async: Dead-Letter Queue</text>
    <text x="90" y="96" class="text-sub">No Cascading Outage</text>
  </g>

  <!-- Flow Lines -->
  <line x1="220" y1="195" x2="260" y2="195" class="arrow" />
  <line x1="460" y1="195" x2="500" y2="195" class="arrow" />
  <line x1="700" y1="195" x2="740" y2="195" class="arrow" />

  <!-- Core Invariant Footer -->
  <rect x="40" y="350" width="880" height="110" class="box" style="stroke: #818cf8; fill: #1e1b4b;" />
  <text x="480" y="385" class="text-title" style="font-size: 16px; fill: #c7d2fe;">Resilience Invariant</text>
  <text x="480" y="415" class="text-sub" style="font-size: 13px; fill: #e0e7ff;">"A dependency is not fully designed until its failure behavior is understood."</text>
  <text x="480" y="438" class="text-sub">Protect thread capacity, eliminate retry storms, isolate blast radius, and preserve truthful business state.</text>
</svg>
