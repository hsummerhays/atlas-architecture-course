<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .step-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .fit-box { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 8; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">Evolutionary Architecture Feedback Loop</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">Guiding architectural change through automated fitness functions, parallel run migrations, and operational feedback</text>

  <!-- Step 1: Decision & ADR -->
  <g transform="translate(60, 120)">
    <rect width="190" height="110" class="step-box" />
    <text x="95" y="35" class="text-title">1. Deliberate Choice</text>
    <text x="95" y="58" class="text-sub">Architecture Decision Record</text>
    <text x="95" y="78" class="text-sub">Explicit Tradeoffs &amp; Cost</text>
    <text x="95" y="96" class="text-sub">Review Triggers Defined</text>
  </g>

  <!-- Step 2: Fitness Functions -->
  <g transform="translate(380, 120)">
    <rect width="200" height="110" class="fit-box" />
    <text x="100" y="35" class="text-title" style="fill: #c7d2fe;">2. Fitness Functions</text>
    <text x="100" y="58" class="text-sub">Automated CI Boundary Tests</text>
    <text x="100" y="78" class="text-sub">Drift &amp; Dependency Checks</text>
    <text x="100" y="96" class="text-sub">Prevent Silent Decay</text>
  </g>

  <!-- Step 3: Expand-and-Contract -->
  <g transform="translate(700, 120)">
    <rect width="200" height="110" class="step-box" />
    <text x="100" y="35" class="text-title">3. Safe Migration</text>
    <text x="100" y="58" class="text-sub">Expand Contract First</text>
    <text x="100" y="78" class="text-sub">Migrate Traffic &amp; Readers</text>
    <text x="100" y="96" class="text-sub">Contract Old Deprecated Path</text>
  </g>

  <!-- Step 4: Production Evidence -->
  <g transform="translate(540, 320)">
    <rect width="200" height="110" class="step-box" />
    <text x="100" y="35" class="text-title">4. Production Evidence</text>
    <text x="100" y="58" class="text-sub">SLO &amp; Telemetry Feedback</text>
    <text x="100" y="78" class="text-sub">Incident Retrospectives</text>
    <text x="100" y="96" class="text-sub">Operational Toil &amp; Drift</text>
  </g>

  <!-- Step 5: Evolve or Supersede -->
  <g transform="translate(220, 320)">
    <rect width="200" height="110" class="step-box" />
    <text x="100" y="35" class="text-title">5. Evolve &amp; Supersede</text>
    <text x="100" y="58" class="text-sub">Evaluate Hypotheses</text>
    <text x="100" y="78" class="text-sub">Retire / Simplify / Supersede</text>
    <text x="100" y="96" class="text-sub">Direction, Not Destination</text>
  </g>

  <!-- Connecting Arrows Loop -->
  <line x1="250" y1="175" x2="380" y2="175" class="arrow" />
  <line x1="580" y1="175" x2="700" y2="175" class="arrow" />
  <path d="M 800,230 L 800,375 L 740,375" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="540" y1="375" x2="420" y2="375" class="arrow" />
  <path d="M 220,375 L 155,375 L 155,230" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)" />
</svg>
