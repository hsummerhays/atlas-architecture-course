<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .core-box { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 8; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .text-header { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; }
      .text-num { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="40" y="45" class="text-header">The Architect's Method — Structured Process</text>
  <text x="40" y="70" class="text-sub" style="text-anchor: start;">From business outcomes and domain models to vertical slices, production evidence, and audience-tailored communication</text>

  <!-- Row 1: Problem -> Requirements -> Model -> Boundaries -->
  <g transform="translate(40, 120)">
    <rect width="190" height="130" class="box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">1</text>
    <text x="95" y="45" class="text-title">Frame Problem</text>
    <text x="95" y="68" class="text-sub">Business Outcome</text>
    <text x="95" y="86" class="text-sub">Actors &amp; Journeys</text>
    <text x="95" y="104" class="text-sub">Real vs Assumed Limits</text>
  </g>

  <g transform="translate(270, 120)">
    <rect width="190" height="130" class="box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">2</text>
    <text x="95" y="45" class="text-title">Domain Model</text>
    <text x="95" y="68" class="text-sub">Ubiquitous Language</text>
    <text x="95" y="86" class="text-sub">Core Invariants</text>
    <text x="95" y="104" class="text-sub">Commands &amp; Events</text>
  </g>

  <g transform="translate(500, 120)">
    <rect width="190" height="130" class="box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">3</text>
    <text x="95" y="45" class="text-title">Set Boundaries</text>
    <text x="95" y="68" class="text-sub">Ports &amp; Adapters</text>
    <text x="95" y="86" class="text-sub">Transaction Boundaries</text>
    <text x="95" y="104" class="text-sub">Trust / Auth Boundaries</text>
  </g>

  <g transform="translate(730, 120)">
    <rect width="190" height="130" class="box" />
    <circle cx="20" cy="20" r="12" fill="#0369a1" />
    <text x="20" y="24" class="text-num">4</text>
    <text x="95" y="45" class="text-title">Design Failure</text>
    <text x="95" y="68" class="text-sub">Failure Modes Matrix</text>
    <text x="95" y="86" class="text-sub">Timeouts &amp; Retries</text>
    <text x="95" y="104" class="text-sub">Circuit Breakers &amp; DLQ</text>
  </g>

  <!-- Row 2: Walking Skeleton -> Production Evidence -> Progressive Communication -->
  <g transform="translate(150, 310)">
    <rect width="200" height="130" class="core-box" />
    <circle cx="20" cy="20" r="12" fill="#4338ca" />
    <text x="20" y="24" class="text-num">5</text>
    <text x="100" y="45" class="text-title" style="fill: #c7d2fe;">Walking Skeleton</text>
    <text x="100" y="68" class="text-sub">Thin Vertical Slice</text>
    <text x="100" y="86" class="text-sub">Validate End-to-End Assumptions</text>
    <text x="100" y="104" class="text-sub">Smallest Sufficient Architecture</text>
  </g>

  <g transform="translate(390, 310)">
    <rect width="200" height="130" class="core-box" />
    <circle cx="20" cy="20" r="12" fill="#4338ca" />
    <text x="20" y="24" class="text-num">6</text>
    <text x="100" y="45" class="text-title" style="fill: #c7d2fe;">Production Evidence</text>
    <text x="100" y="68" class="text-sub">Test Hypotheses</text>
    <text x="100" y="86" class="text-sub">SLO &amp; Toil Telemetry</text>
    <text x="100" y="104" class="text-sub">Evolve, Simplify, or Retire</text>
  </g>

  <g transform="translate(630, 310)">
    <rect width="200" height="130" class="core-box" />
    <circle cx="20" cy="20" r="12" fill="#4338ca" />
    <text x="20" y="24" class="text-num">7</text>
    <text x="100" y="45" class="text-title" style="fill: #c7d2fe;">Communication</text>
    <text x="100" y="68" class="text-sub">Audience-Tailored Views</text>
    <text x="100" y="86" class="text-sub">Progressive Disclosure</text>
    <text x="100" y="104" class="text-sub">Explicit Tradeoff Narrative</text>
  </g>

  <!-- Connectors -->
  <line x1="230" y1="185" x2="270" y2="185" class="arrow" />
  <line x1="460" y1="185" x2="500" y2="185" class="arrow" />
  <line x1="690" y1="185" x2="730" y2="185" class="arrow" />
  <path d="M 825,250 L 825,280 L 250,280 L 250,310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="350" y1="375" x2="390" y2="375" class="arrow" />
  <line x1="590" y1="375" x2="630" y2="375" class="arrow" />
</svg>
